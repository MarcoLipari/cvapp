<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CV Manager Safari Helper</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <span class="eyebrow">CV MANAGER</span>
        <h1>Safari helper</h1>
        <p>Attach a saved CV or log the current application.</p>
      </header>

      <section>
        <h2>Attach a CV</h2>
        <div id="cv-list" class="cv-list"><p>Loading your CVs…</p></div>
        <p class="hint">You can also use “Choose from CV Manager” beside a résumé upload field.</p>
      </section>
      <button id="log-page" type="button" class="secondary">Log this page as applied</button>
      <p id="status" role="status"></p>
      <footer>CV Manager</footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
